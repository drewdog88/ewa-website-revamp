# Separate Container Manager project. Do not add these to unifipoller.
# Grafana stays on the existing UniFi instance at http://192.168.1.190:3000
services:
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    container_name: ewa-blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"

  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: ewa-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"

  blob-exporter:
    image: node:22-alpine
    container_name: ewa-blob-exporter
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --disable-warning=DEP0169
    env_file:
      - ./blob/exporter.env
    volumes:
      - ./blob/export.mjs:/app/export.mjs:ro
    command: ["node", "/app/export.mjs"]
    depends_on:
      - pushgateway

  cf-exporter:
    image: node:22-alpine
    container_name: ewa-cf-exporter
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --disable-warning=DEP0169
    env_file:
      - ./cloudflare/exporter.env
    volumes:
      - ./cloudflare/export.mjs:/app/export.mjs:ro
    command: ["node", "/app/export.mjs"]
    depends_on:
      - pushgateway
